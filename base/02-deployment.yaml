apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-resiliencia
  labels:
    app: hola-resiliencia
    app.kubernetes.io/part-of: hola-resiliencia
spec:
  replicas: 3                      # >1 réplica: sin punto único de falla
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # nunca baja capacidad durante un rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: hola-resiliencia
  template:
    metadata:
      labels:
        app: hola-resiliencia
    spec:
      topologySpreadConstraints:   # reparte réplicas entre nodos
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hola-resiliencia
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:               # requests/limits: necesarios para que el HPA funcione
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          configMap:
            name: hola-resiliencia-html
