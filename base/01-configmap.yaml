apiVersion: v1
kind: ConfigMap
metadata:
  name: hola-resiliencia-html
  labels:
    app: hola-resiliencia
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hola Resiliencia · Bee Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
      :root{--blue:#0f62fe;--blue-dark:#002d9c;--ink:#161616;--muted:#525252;--card:#fff;}
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
           background:linear-gradient(180deg,#e5efff 0%,#f4f8ff 45%,#fff 100%);min-height:100vh}
      .wrap{max-width:1040px;margin:0 auto;padding:48px 32px 32px}
      .tag{display:inline-block;background:var(--blue);color:#fff;font-weight:600;font-size:14px;padding:6px 12px}
      header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:16px}
      .brand{font-size:64px;font-weight:700;letter-spacing:-1.5px;line-height:1}
      .brand .bee{color:var(--blue)}
      .sub{font-size:40px;font-weight:700;color:var(--blue);margin-top:12px;letter-spacing:-.5px}
      .bee-img{width:200px;height:auto;flex-shrink:0;mix-blend-mode:multiply}
      .hello{margin-top:36px;background:var(--card);border-radius:12px;padding:32px;
             box-shadow:0 4px 24px rgba(15,98,254,.08)}
      .hello h1{font-size:44px;letter-spacing:-1px}
      .hello p{font-size:19px;color:var(--muted);margin-top:8px;line-height:1.5}
      .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
      .chip{background:#edf5ff;color:var(--blue-dark);border:1px solid #d0e2ff;font-weight:500;
            font-size:15px;padding:6px 14px;border-radius:24px}
      .chip.ok::before{content:"● ";color:#24a148}
      .section{margin-top:40px}
      .label{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--blue-dark);text-transform:uppercase}
      .section h2{font-size:30px;margin-top:6px;letter-spacing:-.5px}
      .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
      .step{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 2px 12px rgba(15,98,254,.06)}
      .num{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;
           display:flex;align-items:center;justify-content:center}
      .step h3{font-size:18px;margin-top:14px}
      .step p{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.45}
      code{font-family:"IBM Plex Mono",monospace;font-size:13px;background:#f2f4f8;padding:2px 6px;border-radius:4px;color:var(--blue-dark)}
      .why{margin-top:40px;border-left:4px solid var(--blue);background:#fff;padding:20px 24px;border-radius:0 12px 12px 0}
      .why p{font-size:17px;line-height:1.55;color:var(--muted)}
      .why b{color:var(--ink)}
      footer{display:flex;justify-content:space-between;align-items:center;margin-top:56px;
             padding-top:20px;border-top:1px solid #d0e2ff;color:var(--muted);font-size:14px}
      footer .ibm{font-weight:700;color:var(--blue);letter-spacing:3px;font-size:20px}
      @media (max-width:640px){.brand{font-size:44px}.sub{font-size:28px}.bee-img{width:120px}.hello h1{font-size:32px}}
    </style>
    </head>
    <body>
    <div class="wrap">
      <span class="tag">Comunidad</span>
      <header>
        <div>
          <div class="brand"><span class="bee">Bee</span> Tech</div>
          <div class="sub">Bootcamp Hands-On · IBM Concert</div>
        </div>
        <img class="bee-img" src="bee.gif" alt="Abeja Bee Tech">
      </header>

      <section class="hello">
        <h1>¡Hola, Resiliencia! 👋</h1>
        <p>Esta app corre en OpenShift y está siendo evaluada por IBM Concert. Hoy vas a ver cómo un cambio
           de configuración mueve su postura de resiliencia.</p>
        <div class="chips">
          <span class="chip ok">3 réplicas</span>
          <span class="chip ok">Autoescalado (HPA)</span>
          <span class="chip ok">Readiness probe</span>
          <span class="chip ok">Liveness probe</span>
          <span class="chip ok">Pod Disruption Budget</span>
        </div>
      </section>

      <section class="section">
        <div class="label">Tu misión</div>
        <h2>Quita los health checks y mira qué detecta Concert</h2>
        <div class="steps">
          <div class="step"><div class="num">1</div><h3>Revisa la postura</h3>
            <p>En Concert → Resilience → Postures, abre tu app y mira Availability y Usability.</p></div>
          <div class="step"><div class="num">2</div><h3>Aplica el cambio</h3>
            <p>En la terminal:<br><code>./quitar-probes.sh concert-bootcamp-&lt;n&gt;</code></p></div>
          <div class="step"><div class="num">3</div><h3>Reevalúa</h3>
            <p>Integrations → Ingestion jobs → tu job → ⋮ → <b>Run now</b>.</p></div>
          <div class="step"><div class="num">4</div><h3>Compara</h3>
            <p>Espera ~2 minutos y abre la última evaluación. ¿Qué pasó con Availability?</p></div>
        </div>
      </section>

      <div class="why">
        <p><b>¿Por qué importa?</b> Sin health checks, Kubernetes solo sabe que el proceso está corriendo.
           Si la app se cuelga, le sigue mandando tráfico y nunca la reinicia. Concert lo detecta como un
           riesgo de disponibilidad.</p>
      </div>

      <footer>
        <span class="ibm">IBM</span>
        <span>Bee Tech · Bootcamp IBM Concert · Noviembre 2026</span>
      </footer>
    </div>
    </body>
    </html>
